<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dasani Subscriptions</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--t:#4FB3BF;--td:#1f7a86;--tp:#e6f5f8;--bg:#f3fafc;--card:#fff;--tx:#12343b;--mu:#587378;--g:#2E9E4F;--bd:#d5e8ec;--sh:0 4px 18px rgba(31,122,134,.12);--warn:#b45309;--wb:#fff4e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a1d;--card:#15272b;--tx:#e6f3f5;--mu:#9bb8be;--bd:#27424a;--tp:#173a40;--td:#6fcad5;--wb:#3a2d12;--warn:#f5b45a}}
html,body{height:100%;margin:0}body{font-family:Nunito,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;min-height:44px}button:disabled{opacity:.4;cursor:not-allowed}
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.scr{flex:1;overflow-y:auto;padding-bottom:16px}
h1,h2,h3{margin:0}h2{font-size:19px;margin:18px 16px 8px}h3{font-size:16px}.mu{color:var(--mu);font-size:13px}.pad{padding:0 16px}
.hd{background:linear-gradient(135deg,#4FB3BF,#7fd0d6);color:#fff;padding:16px 16px 40px;position:relative;border-radius:0 0 28px 28px}
.hd .top{display:flex;justify-content:space-between;align-items:center}.hd h1{font-size:23px;margin-top:6px}
.logo{font-weight:800;letter-spacing:.18em;font-size:15px}
.bell{position:relative;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);font-size:19px}.bell i{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:#e2483d;border:2px solid #4FB3BF}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px;margin:12px 16px}
.btn{min-height:48px;border-radius:24px;padding:0 20px;font-weight:800;background:var(--td);color:#fff;width:100%}.btn.o{background:none;border:2px solid var(--td);color:var(--td)}.btn.g{background:var(--g)}.btn.r{background:none;color:#b3261e;border:2px solid #e8b4b0}.btn.s{width:auto;min-height:44px;padding:0 16px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.seg{display:flex;background:var(--tp);border-radius:22px;padding:3px;margin:0}.seg button{flex:1;border-radius:19px;font-weight:700;font-size:13px;color:var(--mu);min-height:40px;padding:0 4px}.seg button.on{background:var(--card);color:var(--td);box-shadow:var(--sh)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px}.chip{flex:none;padding:0 16px;border-radius:22px;background:var(--card);border:1px solid var(--bd);font-weight:700;font-size:14px}.chip.on{background:var(--td);color:#fff;border-color:var(--td)}
.st{display:inline-flex;align-items:center;background:var(--tp);border-radius:22px}.st button{width:44px;font-size:20px;font-weight:800;color:var(--td)}.st b{min-width:22px;text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:8px;padding:2px 8px;background:var(--wb);color:var(--warn)}.tag.new{background:var(--g);color:#fff}.tag.ok{background:#dff3e5;color:#1d7a3b}
.meter{background:var(--card);border-radius:18px;padding:10px 14px;box-shadow:var(--sh)}.bar{height:10px;border-radius:5px;background:var(--tp);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--t);border-radius:5px;transition:width .3s}.bar i.full{background:var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 16px}.pc{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:12px;position:relative}.pc .im{height:110px;display:flex;justify-content:center;background:var(--tp);border-radius:14px;padding:6px;cursor:pointer}
.im svg,.pi svg{height:100%;width:auto}.pi{width:34px;height:64px;flex:none}
.tabbar{display:flex;background:var(--card);border-top:1px solid var(--bd)}.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mu);gap:1px;min-height:58px}.tabbar button.on{color:var(--td)}.tabbar span{font-size:21px}
.sticky{position:sticky;bottom:0;padding:8px 16px;background:linear-gradient(transparent,var(--bg) 25%)}
.sh{position:fixed;inset:0;background:rgba(8,36,44,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:f .2s}.sh>div{width:100%;max-width:430px;max-height:90%;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:u .25s}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(40px)}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#12343b;color:#fff;border-radius:24px;padding:4px 8px 4px 18px;display:none;align-items:center;gap:8px;z-index:90;max-width:92%;box-shadow:var(--sh);font-weight:700}#toast button{color:#7fe0b0;font-weight:800;padding:0 12px}
.box{margin:-24px 16px 0;position:relative}.lid{height:34px;background:#3a9aa6;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:.2em;font-size:13px}.inner{background:linear-gradient(#2f8791,#4FB3BF);padding:12px;border-radius:0 0 20px 20px;box-shadow:var(--sh);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:100px}.dim{opacity:.4;filter:grayscale(.6)}
.bx{position:relative;width:54px;height:92px;background:rgba(255,255,255,.9);border-radius:12px;padding:5px;display:flex;justify-content:center}.bq{position:absolute;right:-6px;top:-6px;background:var(--g);color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:1px 6px}.bx .dot{position:absolute;left:-3px;bottom:-3px;background:#f59e0b;width:12px;height:12px;border-radius:50%}
.trk{display:flex;margin:14px 0 4px}.trk div{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--mu);position:relative}.trk div:before{content:"";display:block;width:16px;height:16px;border-radius:50%;background:var(--bd);margin:0 auto 4px}.trk div.d:before{background:var(--t)}.trk div.c:before{background:var(--g);box-shadow:0 0 0 4px #2e9e4f33}.trk div.c{color:var(--tx)}
.alert{background:var(--wb);border-radius:16px;padding:12px 14px;margin:12px 16px;color:var(--tx)}
.pr{display:flex;justify-content:space-between;padding:4px 0}.pr.t{font-weight:800;font-size:17px;border-top:1px dashed var(--bd);margin-top:6px;padding-top:10px}
input[type=text],textarea,select{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);min-height:48px}input:focus,textarea:focus{outline:2px solid var(--t)}
input[type=range]{width:100%;accent-color:var(--td);height:44px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--bd);border-radius:16px;margin-bottom:10px;width:100%;text-align:left}.opt.on{border-color:var(--td);background:var(--tp)}
.big{padding:70px 24px 20px;text-align:center}.big .logo{font-size:30px;color:var(--td)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--bd);position:relative;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--g)}.sw.on:after{left:23px}
.li{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--bd);width:100%;text-align:left;min-height:52px}
details{border-bottom:1px solid var(--bd);padding:10px 0}summary{font-weight:700;cursor:pointer;min-height:30px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=i=>document.getElementById(i),TIERS=[12,24,36,48];
const disc=n=>n>=48?.12:n>=36?.1:n>=24?.08:n>=12?.05:0,fm=n=>"$"+n.toFixed(2),fd=n=>new Date(2026,10,23+n).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const P=[];
[["s8","8 fl oz",.6],["s12","12 fl oz",.7],["s169","16.9 fl oz",.85],["s20","20 fl oz",.95],["s1l","1 L",1.25]].forEach(([id,s,pr])=>P.push({id,n:"Still Water",s,fl:s,cat:"Still",pr,c:"#9fd8e0",cap:"#2E9E4F",d:"Purified water enhanced with minerals for a crisp, clean taste.",i:"Purified water, magnesium sulfate, potassium chloride, salt."}));
[["f-lem","Lemon","#f3e27a"],["f-lim","Lime","#a6dc7c"],["f-st","Strawberry","#f59aa8"],["f-bc","Black Cherry","#a0405f"]].forEach(([id,f,c])=>P.push({id,n:"Flavored Water",s:f+" · 16.9 fl oz",fl:f,cat:"Flavored",pr:1.1,c,cap:"#2E9E4F",d:"Lightly flavored water with zero sugar and zero calories.",i:"Purified water, natural flavors, magnesium sulfate, potassium chloride."}));
[["p-lem","Lemon","#f3e27a"],["p-lim","Lime","#a6dc7c"],["p-bc","Black Cherry","#a0405f"],["p-pe","Peach","#f8b88a"]].forEach(([id,f,c])=>P.push({id,n:"Sparkling Water",s:f+" · 12 fl oz",fl:f,cat:"Sparkling",pr:1.15,c,cap:"#4FB3BF",d:"Crisp bubbles and a hint of real fruit flavor. No sweeteners.",i:"Carbonated purified water, natural flavors."}));
[["t-ll","Lemon-Lime","#c5e04a",4.99],["t-or","Orange","#f59e2b",4.99],["t-be","Berry","#7a6cf0",5.49],["t-wm","Watermelon","#f0566e",5.49]].forEach(([id,f,c,pr])=>P.push({id,n:"Electrolyte Tablets",s:f+" · 10 tablets",fl:f,cat:"Electrolytes",pr,c,nw:1,d:"Drop one tablet in water for fast, fizzy hydration with electrolytes.",i:"Citric acid, sodium bicarbonate, potassium, magnesium, natural flavors, stevia leaf extract."}));
const BUN=[{n:"Everyday Still Pack",items:{s169:6,s20:6}},{n:"Flavor Sampler",items:{"f-lem":3,"f-lim":3,"f-st":3,"f-bc":3}},{n:"Active Pack",items:{"p-lem":4,"t-ll":2,"t-or":2,s20:4}}];
const pd=id=>P.find(p=>p.id==id),pp=id=>pd(id).pr,OOS="p-pe";
const lab=p=>S.units=="ml"?p.s.replace(/([\d.]+) fl oz/,(m,a)=>Math.round(a*29.57)+" mL"):p.s;
const SAMPLE={s169:7,s20:4,"f-lem":3,"f-st":3,"p-lem":3,"p-pe":2,"t-ll":1,"t-or":1};
const wave=`<svg viewBox="0 0 400 40" preserveAspectRatio="none" style="display:block;width:100%;height:30px;margin-top:-1px"><path d="M0 20Q100 -10 200 18T400 12V40H0z" fill="var(--bg)"/></svg>`;
function bt(p){return`<svg viewBox="0 0 60 120"><rect x="22" y="2" width="16" height="10" rx="3" fill="${p.cap}"/><path d="M24 12h12v8c10 6 14 14 14 26v60q0 10-10 10H20q-10 0-10-10V46c0-12 4-20 14-26z" fill="${p.c}" fill-opacity=".4" stroke="#8cc7d1"/><path d="M10 62q15-12 40-2v26q-25-10-40 2z" fill="#4FB3BF"/><text x="30" y="79" font-size="8" font-weight="800" fill="#fff" text-anchor="middle">DASANI</text><circle cx="30" cy="100" r="4" fill="${p.c}"/></svg>`}
function tb(p){return`<svg viewBox="0 0 50 120"><rect x="9" y="3" width="32" height="15" rx="3" fill="#1d4ed8"/><rect x="9" y="16" width="32" height="101" rx="5" fill="#fff" stroke="#cfe3e8"/><path d="M9 46q16-10 32 0v28q-16-10-32 0z" fill="#4FB3BF"/><text x="25" y="63" font-size="6.5" font-weight="800" fill="#fff" text-anchor="middle">DASANI</text><text x="25" y="86" font-size="4.6" fill="#1f7a86" text-anchor="middle" font-weight="700">Electrolyte Tablets</text><rect x="13" y="94" width="24" height="9" rx="4.5" fill="${p.c}"/><text x="25" y="100.5" font-size="4" font-weight="800" fill="#12343b" text-anchor="middle">${p.fl}</text></svg>`}
const art=p=>p.cat=="Electrolytes"?tb(p):bt(p);
let S={user:"",onb:0,tab:"home",seg:0,size:24,def:{},once:null,freq:2,status:"active",scope:"every",next:6,tracker:0,pauseUntil:0,sim:false,units:"oz",q:"",cat:"All",sheet:null,addr:["412 N University Ave, Provo, UT 84601","1250 E 800 N, Orem, UT 84097"],dAddr:0,shipAddr:0,win:"Afternoon (12–5 PM)",instr:"Leave at front door.",
 notifs:[{t:"Your order has shipped",d:"Order #DS-10482 was delivered Nov 9.",r:0},{t:"Edit cutoff is in 3 days",d:"Make changes to your next box by Nov 26.",r:0},{t:"New: Electrolyte Tablets",d:"Add a tube to your next box.",r:0}],
 pref:{Shipped:1,"Out for delivery":1,Delivered:1,"Cutoff reminders":1,"Payment failed":1,Promotions:0},cards:[{n:"Visa •••• 4242",e:"09/28"},{n:"Mastercard •• 1881",e:"02/27"}],dCard:0,
 hist:[{id:"#DS-10482",d:"Nov 9",it:{s169:8,s20:4,"f-lem":4,"p-lem":4,"t-ll":1,"t-be":1,"p-bc":2},st:"Delivered"},{id:"#DS-10311",d:"Oct 26",it:{s169:8,s20:4,"f-st":4,"p-lim":4,"t-or":2,"p-pe":2},st:"Delivered"},{id:"#DS-10190",d:"Oct 12",it:{s169:10,s20:4,"f-lim":4,"p-lem":4,"p-pe":2},st:"Delivered"},{id:"#DS-10044",d:"Sep 28",it:{s169:10,s12:4,"f-bc":4,"p-bc":4,"p-pe":2},st:"Delivered"},{id:"#DS-9902",d:"Sep 14",it:{s169:12,s20:4,"f-lem":4,"p-lem":4},st:"Delivered"}]};
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0),cur=()=>S.once||S.def,locked=()=>S.sim||S.next-3<0;
const total=o=>Object.entries(o).reduce((a,[k,v])=>a+pp(k)*v,0);
function price(o){const sub=total(o),dc=sub*disc(S.size),tx=(sub-dc)*.07;return{sub,dc,tx,tot:sub-dc+tx}}
function pricing(o){const x=price(o);return`<div class="pr"><span>Item subtotal</span><span>${fm(x.sub)}</span></div><div class="pr" style="color:var(--g)"><span>Subscription discount (${Math.round(disc(S.size)*100)}%)</span><span>−${fm(x.dc)}</span></div><div class="pr"><span>Shipping</span><span>Free</span></div><div class="pr"><span>Sales tax (7%)</span><span>${fm(x.tx)}</span></div><div class="pr t"><span>Estimated total</span><span>${fm(x.tot)}</span></div>`}
function meter(o){const n=sum(o),f=n>=S.size;return`<div class="meter"><div class="row sp"><b>${n} of ${S.size} items</b><span class="${f?"tag ok":"mu"}">${f?"✓ Package full":S.size-n+" spots left"}</span></div><div class="bar"><i class="${f?"full":""}" style="width:${Math.min(100,n/S.size*100)}%"></i></div></div>`}
const KEYS=["def","once","size","freq","status","next","tracker","pauseUntil"];
function snap(){S.last=JSON.stringify(KEYS.map(k=>S[k]));if(!S.base)S.base=S.last}
function rest(j){JSON.parse(j).forEach((v,i)=>S[KEYS[i]]=v)}
function undo(b){const j=b&&S.base?S.base:S.last;if(j)rest(j);S.base=null;$("toast").style.display="none";render()}
let tt;function toast(m,u){const t=$("toast");t.innerHTML=`<span>${m}</span>${u?`<button onclick="undo(${u=="base"})">Undo</button>`:""}`;t.style.display="flex";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",5000)}
function clean(){for(const o of[S.def,S.once])if(o)for(const k in o)if(!o[k])delete o[k];if(S.once&&JSON.stringify(Object.entries(S.once).sort())==JSON.stringify(Object.entries(S.def).sort()))S.once=null}
function fit(o,n){while(sum(o)>n){const k=Object.keys(o).sort((a,b)=>o[b]-o[a])[0];o[k]--}clean()}
function ap(m,sc){sc=sc||S.scope;if(S.onb==9&&locked())return toast("Changes are locked for this delivery");
 const add=Object.values(m).reduce((a,b)=>a+Math.max(b,0),0),base=sc=="every"?S.def:cur();
 if(add>0&&sum(base)+add>S.size){S.sheet={t:"up",m,sc};return render()}
 if(S.onb<9)sc="every";snap();const ch=(o,k,d)=>o[k]=Math.max(0,(o[k]||0)+d);
 if(sc=="every"){for(const k in m){ch(S.def,k,m[k]);if(S.once)ch(S.once,k,m[k])}}else{S.once=S.once||{...S.def};for(const k in m)ch(S.once,k,m[k])}
 clean();if(S.onb==9)toast(sc=="every"?"Default plan updated":"Updated for this delivery only",S.tab=="products"?"base":true);render()}
const apP=m=>ap(m,"every");
function upDo(){const{m,sc}=S.sheet,need=sum(sc=="every"?S.def:cur())+Object.values(m).reduce((a,b)=>a+Math.max(b,0),0),n=TIERS.find(t=>t>=need&&t>S.size);S.sheet=null;snap();S.size=n;ap(m,sc);toast("Upgraded to "+n+" items",true)}
function setSize(n){n=Math.max(12,Math.min(60,n));snap();S.size=n;fit(S.def,n);if(S.once)fit(S.once,n);if(S.onb==9)toast("Size set to "+n+" items",true);render()}
function setScope(s){S.scope=s;render()}
function scopeSeg(){return`<div class="seg" role="group" aria-label="Apply change to"><button class="${S.scope=="once"?"on":""}" onclick="setScope('once')">Just this delivery</button><button class="${S.scope=="every"?"on":""}" onclick="setScope('every')">Every delivery</button></div>`}
function stp(id,q,fn){fn=fn||"ap";const l=S.onb==9&&locked()&&fn=="ap";return`<div class="st"><button aria-label="Remove one" ${l||!q?"disabled":""} onclick="${fn}({'${id}':-1})">–</button><b>${q}</b><button aria-label="Add one" ${l?"disabled":""} onclick="${fn}({'${id}':1})">+</button></div>`}
/* ---------- ONBOARDING ---------- */
function mix(sz){const m={};for(const[k,v]of Object.entries(SAMPLE))m[k]=Math.max(0,Math.round(v*sz/24));m.s169=(m.s169||0)+sz-sum(m);return m}
function onb(){const s=S.onb;
 if(s==0)return`<div class="big"><div class="logo">DASANI</div><svg viewBox="0 0 200 60" style="width:200px;margin:14px 0"><path d="M0 30Q50 0 100 30T200 30V60H0z" fill="#4FB3BF"/><path d="M0 42Q50 14 100 42T200 42V60H0z" fill="#7fd0d6" opacity=".7"/></svg><h1 style="font-size:26px">Crisp. Clean. Refreshing.</h1><p class="mu">Fresh water on your schedule.</p><div style="text-align:left;margin:30px 0 14px"><label for="nm" style="font-weight:800">What’s your name?</label><input type="text" id="nm" placeholder="Your name" style="margin-top:8px" value="${S.user}"></div><button class="btn" onclick="S.user=($('nm').value.trim()||'Alex');S.onb=1;render()">Continue</button></div>`;
 const head=`<div class="hd" style="padding-bottom:20px"><div class="row sp"><button onclick="S.onb=${s-1};render()" style="color:#fff;font-weight:800;min-width:44px">← Back</button><span class="logo">DASANI</span><span style="width:60px;text-align:right;font-size:13px">${s} of 5</span></div><h1>Build your first package</h1></div>`;let b="";
 if(s==1)b=`<h2>How many items per delivery?</h2><p class="mu pad">Each bottle or tube counts as 1 item. Bigger packages save more.</p><div class="pad" style="margin-top:12px">${TIERS.map(t=>`<button class="opt ${S.size==t?"on":""}" onclick="S.size=${t};S.def=mix(${t});render()"><b class="grow">${t} items</b><span class="tag ok">Save ${Math.round(disc(t)*100)}%</span></button>`).join("")}<div class="card row sp" style="margin:0"><div><b>Custom size</b><div class="mu">${Math.round(disc(S.size)*100)}% discount</div></div><div class="st"><button onclick="S.size=Math.max(12,S.size-1);S.def=mix(S.size);render()">–</button><b>${S.size}</b><button onclick="S.size=Math.min(60,S.size+1);S.def=mix(S.size);render()">+</button></div></div></div>`;
 if(s==2){if(!sum(S.def))S.def=mix(S.size);b=`<h2>Choose your mix</h2><div class="pad">${meter(S.def)}<button class="btn o s" style="margin-top:10px" onclick="S.def=mix(S.size);render()">Use suggested mix</button></div><div style="padding:8px 16px">${P.map(p=>prow(p,S.def[p.id]||0)).join("")}</div>`}
 if(s==3)b=freqUI();
 if(s==4)b=`<h2>Confirm your address</h2><div class="card"><b>${S.user}</b><p style="margin:4px 0">${S.addr[0]}</p><span class="tag ok">Default address</span></div><p class="mu pad">You can add or change addresses later in Profile.</p>`;
 if(s==5)b=`<h2>Review your package</h2><div class="card">${Object.entries(S.def).map(([k,v])=>`<div class="pr"><span>${v} × ${pd(k).n}, ${lab(pd(k))}</span><span>${fm(pp(k)*v)}</span></div>`).join("")}<div style="margin-top:8px">${pricing(S.def)}</div></div><p class="mu pad">${S.size} items every ${S.freq} week${S.freq>1?"s":""}. Next delivery ${fd(S.next)} to ${S.addr[0]}.</p>`;
 const ok=s==2?sum(S.def)>0:true;
 return head+`<div style="flex:1">${b}</div><div class="sticky"><button class="btn ${s==5?"g":""}" ${ok?"":"disabled"} onclick="${s==5?"S.onb=9;S.tab='home';toast('Subscription confirmed. Welcome, '+S.user+'!');render()":`S.onb=${s+1};render()`}">${s==5?"Confirm subscription":"Continue"}</button></div>`}
function prow(p,q){return`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><div class="pi">${art(p)}</div><div class="grow"><b>${p.n}</b> ${p.nw?'<span class="tag new">New</span>':""}<div class="mu">${lab(p)} · ${fm(p.pr)}</div></div>${stp(p.id,q,S.fn||"ap")}</div>`}
function dates(){let a=[];for(let i=0;i<3;i++)a.push(fd(S.next+i*S.freq*7));return a.join(" → ")}
function freqUI(){return`<h2>How often?</h2><div class="card"><div class="row sp"><b>Every <span id="fv">${S.freq} week${S.freq>1?"s":""}</span></b></div><input type="range" min="1" max="8" value="${S.freq}" aria-label="Delivery frequency in weeks" oninput="setF(this.value)"><div class="row sp mu"><span>1 wk</span><span>8 wks</span></div><p style="margin:10px 0 0"><b>Next:</b> <span id="fp">${dates()}</span></p></div>`}
function setF(v){S.freq=+v;$("fv").textContent=v+" week"+(v>1?"s":"");$("fp").textContent=dates()}
/* ---------- HOME ---------- */
function trk(){const n=["Preparing","Shipped","Out for delivery","Delivered"];return`<div class="trk">${n.map((x,i)=>`<div class="${i<S.tracker?"d":i==S.tracker?"c":""}">${x}</div>`).join("")}</div>`}
function oosAlert(){if(S.status!="active"||!(cur()[OOS]>0))return"";return`<div class="alert"><b>⚠ ${pd(OOS).n}, ${lab(pd(OOS))} is out of stock</b><div class="mu" style="margin:2px 0 8px">Substitute it or remove it from your next delivery.</div><button class="btn s" onclick="S.sheet={t:'oos'};render()">Resolve now</button></div>`}
function pkg(){const c=cur(),e=Object.entries(c);return`<div class="box ${S.status=="paused"?"dim":""}"><div class="lid">DASANI</div><div class="inner">${e.length?e.map(([k,v])=>`<button class="bx" aria-label="Edit ${pd(k).n} ${pd(k).fl}" onclick="S.sheet={t:'det',id:'${k}'};render()"><div style="height:100%">${art(pd(k))}</div><span class="bq">×${v}</span>${S.once&&(S.once[k]||0)!=(S.def[k]||0)?'<i class="dot" title="This delivery only"></i>':""}</button>`).join(""):'<span style="color:#fff;align-self:center">Your box is empty. Add items in Products.</span>'}</div></div>${S.once?'<div class="pad mu" style="margin-top:6px"><i class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#f59e0b"></i> This delivery only</div>':""}`}
function restart(){return`<div class="card" style="text-align:center;padding:30px 20px"><h3>Your subscription is canceled</h3><p class="mu">Your saved plan is waiting: ${sum(S.def)} items every ${S.freq} weeks.</p><button class="btn g" onclick="snap();S.status='active';S.next=6;toast('Subscription restarted',true);render()">Restart subscription</button></div>`}
function statusCard(){const a=S.status;let h="";
 if(a=="active")h=`<div class="row sp"><div><b>Active</b><div class="mu">Next delivery ${fd(S.next)}</div></div><span class="tag ok">On schedule</span></div>${trk()}<p class="mu" style="margin:6px 0 0">${locked()?"🔒 Editing is locked. Your box is being prepared for shipping.":"You can change your next box until "+fd(S.next-3)+"."}</p>`;
 if(a=="skipped")h=`<b>Skipped. Next delivery is ${fd(S.next)}</b><div style="margin-top:10px"><button class="btn o" onclick="unskip()">Unskip</button></div>`;
 if(a=="paused")h=`<b>Paused until ${fd(S.pauseUntil)}</b><div style="margin-top:10px"><button class="btn" onclick="snap();S.status='active';toast('Subscription resumed',true);render()">Resume</button></div>`;
 return`<div class="card">${h}</div>`}
function skip(){snap();S.skipPrev=S.next;S.next+=S.freq*7;S.status="skipped";S.sheet=null;toast("Delivery skipped",true);render()}
function unskip(){snap();S.next=S.skipPrev||6;S.status="active";toast("Delivery restored",true);render()}
function home(){if(S.status=="canceled")return`<div class="hd"><div class="top"><span class="logo">DASANI</span></div><h1>Hi, ${S.user}</h1></div>${wave}${restart()}`;
 const a=S.status=="active",c=cur(),t=total(c);
 return`<div class="hd"><div class="top"><span class="logo">DASANI</span><button class="bell" aria-label="Notifications" onclick="S.sheet={t:'not'};render()">🔔${S.notifs.some(n=>!n.r)?"<i></i>":""}</button></div><h1>Hi, ${S.user} 👋</h1><div style="opacity:.9">Your next box: ${sum(c)} items</div></div>${pkg()}${statusCard()}${oosAlert()}
 <div class="pad row" style="gap:8px"><button class="btn o s grow" ${a&&!locked()?"":"disabled"} onclick="S.sheet={t:'skip'};render()">Skip</button><button class="btn o s grow" onclick="S.tab='delivery';S.seg=0;render()">Edit package</button><button class="btn s grow" ${a?"":"disabled"} onclick="S.sheet={t:'now'};render()">Deliver now</button></div>
 <h2>For you</h2><div class="card" style="background:linear-gradient(135deg,#e6f5f8,#d3efe0)"><span class="tag new">New</span><h3 style="margin:6px 0">Try our new Electrolyte Tablets</h3><p class="mu" style="margin:0 0 10px">Fizzy hydration in four flavors, from ${fm(4.99)}.</p><button class="btn s" onclick="S.sheet={t:'ask',id:'t-ll'};render()">Add to my next box</button></div>
 <div class="card"><h3>Upgrade to 36 items and save 10%</h3><p class="mu" style="margin:4px 0 10px">${S.size>=36?"You’re already on the top savings.":"You’re at "+Math.round(disc(S.size)*100)+"% now. Estimated total "+fm(price(Object.fromEntries(Object.entries(S.def)))?.tot)+" per box today."}</p><button class="btn o s" ${S.size>=36?"disabled":""} onclick="S.sheet={t:'up',m:{},sc:'every',to:36};render()">See 36-item plan</button></div>`}
/* ---------- PRODUCTS ---------- */
function products(){const q=S.q.toLowerCase(),c=cur();let l=P.filter(p=>(S.cat=="All"||p.cat==S.cat)&&(p.n+" "+p.s).toLowerCase().includes(q));
 const b=S.cat=="Bundles"||(S.cat=="All"&&!q)?BUN.map((x,i)=>`<div class="pc" style="grid-column:1/-1"><div class="row sp"><div><b>${x.n}</b> <span class="tag new">Bundle</span><div class="mu">${sum(x.items)} items · ${Object.entries(x.items).map(([k,v])=>v+"× "+pd(k).fl).join(", ")}</div></div><div style="text-align:right"><b>${fm(total(x.items))}</b><br><button class="btn s" style="min-height:44px" onclick="ap(BUN[${i}].items)">Add</button></div></div></div>`).join(""):"";
 if(S.cat=="Bundles")l=[];
 return`<div class="hd" style="padding-bottom:20px"><div class="top"><span class="logo">DASANI</span><span>Shop</span></div><div style="margin-top:10px"><input type="text" aria-label="Search products" placeholder="🔍 Search water, flavors, tablets" value="${S.q}" oninput="S.q=this.value;render(true)" id="sq"></div></div>
 <div class="chips" style="margin-top:10px">${["All","Still","Flavored","Sparkling","Electrolytes","Bundles"].map(x=>`<button class="chip ${S.cat==x?"on":""}" onclick="S.cat='${x}';render()">${x}</button>`).join("")}</div><div class="pad" style="margin:8px 0">${scopeSeg()}</div>
 <div class="grid">${b}${l.map(p=>`<div class="pc">${p.nw?'<span class="tag new" style="position:absolute;top:10px;left:10px;z-index:1">New</span>':""}<div class="im" onclick="S.sheet={t:'det',id:'${p.id}'};render()">${art(p)}</div><b style="display:block;margin-top:8px">${p.n}</b><div class="mu">${lab(p)}</div><div class="row sp" style="margin-top:6px"><b>${fm(p.pr)}</b>${stp(p.id,c[p.id]||0)}</div></div>`).join("")}</div>${!l.length&&S.cat!="Bundles"?'<p class="mu" style="text-align:center;padding:30px">No products match. Try a different search.</p>':""}
 <div class="sticky" style="margin-top:12px">${meter(c)}<div class="row sp" style="margin-top:8px"><div><div class="mu">Estimated total</div><b>${fm(price(c).tot)}</b></div><button class="btn s" onclick="S.sheet={t:'rev'};render()">Review package</button></div></div>`}
/* ---------- DELIVERY ---------- */
function delivery(){const sg=["Next Delivery","Plan","Details","History"];let b="";
 const head=`<div class="hd" style="padding-bottom:16px"><div class="top"><span class="logo">DASANI</span><span>Delivery</span></div><div class="seg" style="margin-top:12px;background:rgba(255,255,255,.25)">${sg.map((x,i)=>`<button class="${S.seg==i?"on":""}" style="${S.seg==i?"":"color:#fff"}" onclick="S.seg=${i};render()">${x}</button>`).join("")}</div></div>`;
 if(S.status=="canceled")return head+restart();
 if(S.seg==0){const c=cur(),l=locked();b=`${statusCard()}${oosAlert()}<div class="pad">${meter(c)}<div style="margin-top:10px">${scopeSeg()}</div></div><div class="card" style="padding:6px 16px">${Object.entries(c).map(([k,v])=>{const p=pd(k);return`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--bd)"><div class="pi">${art(p)}</div><div class="grow"><b>${p.n}</b><div class="mu">${lab(p)}</div>${S.once&&(S.once[k]||0)!=(S.def[k]||0)?'<span class="tag">This delivery only</span>':""}</div>${stp(k,v)}<button aria-label="Remove" ${l?"disabled":""} onclick="ap({'${k}':-${v}})" style="width:36px">✕</button></div>`}).join("")||'<p class="mu">No items yet. Add some in Products.</p>'}</div>
 <div class="card"><h3 style="margin-bottom:8px">Pricing</h3>${pricing(c)}</div>
 ${S.status=="active"?`<div class="card"><h3>Tracking</h3>${trk()}<p class="mu" style="margin:4px 0">Tracking #: 1Z 9A4 R72 0392 5518 4</p><a href="https://www.ups.com/track" target="_blank" rel="noopener" style="color:var(--td);font-weight:800">Track with UPS ↗</a></div>`:""}
 <div class="pad row" style="gap:8px;flex-wrap:wrap">${S.status=="active"?`<button class="btn o s grow" ${l?"disabled":""} onclick="S.sheet={t:'skip'};render()">Skip</button>`:""}${S.status=="active"?`<button class="btn o s grow" onclick="S.sheet={t:'pause'};render()">Pause</button>`:""}<button class="btn r s grow" onclick="S.sheet={t:'cancel',s:0};render()">Cancel</button></div>${l?'<p class="mu pad" style="margin-top:10px">🔒 Changes lock 3 days before shipping so we can pack your box. Your saved plan still applies to future deliveries.</p>':""}`}
 if(S.seg==1){b=`<div class="pad" style="margin-top:12px">${meter(S.def)}</div><h2>Size</h2><div class="pad">${TIERS.map(t=>`<button class="opt ${S.size==t?"on":""}" onclick="setSize(${t})"><b class="grow">${t} items</b><span class="tag ok">Save ${Math.round(disc(t)*100)}%</span></button>`).join("")}<div class="card row sp" style="margin:0 0 10px"><div><b>Custom size</b><div class="mu">${Math.round(disc(S.size)*100)}% discount</div></div><div class="st"><button onclick="setSize(S.size-1)">–</button><b>${S.size}</b><button onclick="setSize(S.size+1)">+</button></div></div></div><h2>Product mix</h2><p class="mu pad" style="margin:0">Changes here update your saved plan.</p><div style="padding:6px 16px">${P.map(p=>(S.fn="apP",prow(p,S.def[p.id]||0))).join("")}${S.fn=""}</div><h2>Frequency</h2>${freqUI()}`}
 if(S.seg==2)b=`<h2>Delivery address</h2><div class="pad">${S.addr.map((a,i)=>`<button class="opt ${S.shipAddr==i?"on":""}" onclick="S.shipAddr=${i};toast('Address updated for next delivery');render()"><span class="grow">${a}</span>${i==S.dAddr?'<span class="tag ok">Default</span>':""}</button>`).join("")}</div><h2>Delivery window</h2><div class="chips">${["Morning (8–12 AM)","Afternoon (12–5 PM)","Evening (5–8 PM)"].map(w=>`<button class="chip ${S.win==w?"on":""}" onclick="S.win='${w}';render()">${w}</button>`).join("")}</div><h2>Delivery instructions</h2><div class="pad"><textarea rows="3" aria-label="Delivery instructions" oninput="S.instr=this.value">${S.instr}</textarea></div>`;
 if(S.seg==3)b=S.hist.length?`<div style="padding-top:6px">${S.hist.map((o,i)=>`<div class="card"><div class="row sp"><b>${o.id}</b><span class="tag ok">${o.st}</span></div><div class="mu">${o.d} · ${sum(o.it)} items</div><div class="mu" style="margin:4px 0">${Object.entries(o.it).slice(0,4).map(([k,v])=>v+"× "+pd(k).fl).join(", ")}…</div><div class="row sp"><b>${fm(price2(o.it))}</b><button class="btn o s" onclick="repeat(${i})">Repeat this order</button></div></div>`).join("")}</div>`:`<div class="card" style="text-align:center"><h3>No orders yet</h3><p class="mu">Your delivered boxes will show up here.</p></div>`;
 return head+b}
function price2(o){const s=total(o);return s*(1-disc(24))*1.07}
function repeat(i){const o={...S.hist[i].it};snap();fit(o,S.size);S.once=o;clean();S.tab="delivery";S.seg=0;toast("Order loaded into your next delivery",true);render()}
/* ---------- PROFILE ---------- */
const sw=(on,fn)=>`<button role="switch" aria-checked="${!!on}" onclick="${fn}" style="min-width:50px"><div class="sw ${on?"on":""}"></div></button>`;
function profile(){const sp=S.sub;
 const back=t=>`<div class="hd" style="padding-bottom:16px"><button onclick="S.sub=null;render()" style="color:#fff;font-weight:800">← Profile</button><h1>${t}</h1></div>`;
 if(sp=="addr")return back("Saved addresses")+`<div class="card">${S.addr.map((a,i)=>`<div class="li"><div class="grow">${a}${i==S.dAddr?' <span class="tag ok">Default</span>':""}</div><button class="btn o s" style="padding:0 10px" onclick="S.sheet={t:'af',i:${i}};render()">Edit</button>${i!=S.dAddr?`<button class="btn o s" style="padding:0 10px" onclick="S.dAddr=${i};toast('Default address set');render()">Set default</button>`:""}</div>`).join("")}</div><div class="pad"><button class="btn" onclick="S.sheet={t:'af',i:-1};render()">Add address</button></div>`;
 if(sp=="pay")return back("Payment & billing")+`<div class="card">${S.cards.map((c,i)=>`<div class="li"><div class="grow"><b>${c.n}</b><div class="mu">Expires ${c.e}</div></div>${i==S.dCard?'<span class="tag ok">Default</span>':`<button class="btn o s" onclick="S.dCard=${i};toast('Default card updated');render()">Use</button>`}</div>`).join("")}</div><h2>Billing history</h2><div class="card">${S.hist.map(o=>`<div class="pr"><span>${o.d} · ${o.id}</span><b>${fm(price2(o.it))}</b></div>`).join("")}</div>`;
 if(sp=="not")return back("Notifications")+`<div class="card">${Object.keys(S.pref).map(k=>`<div class="row sp li"><span>${k}</span>${sw(S.pref[k],`S.pref['${k}']=${S.pref[k]?0:1};render()`)}</div>`).join("")}</div>`;
 if(sp=="set")return back("App settings")+`<div class="card"><b>Units</b><div class="seg" style="margin:8px 0 14px"><button class="${S.units=="oz"?"on":""}" onclick="S.units='oz';render()">fl oz</button><button class="${S.units=="ml"?"on":""}" onclick="S.units='ml';render()">mL</button></div><div class="row sp"><div><b>Simulate edit cutoff passed</b><div class="mu">Prototype control: locks the next delivery.</div></div>${sw(S.sim,`S.sim=!S.sim;render()`)}</div></div><div class="card"><div class="row sp"><div><b>Tracker step</b><div class="mu">Prototype control</div></div><div class="st"><button onclick="S.tracker=Math.max(0,S.tracker-1);render()">–</button><b>${S.tracker+1}</b><button onclick="S.tracker=Math.min(3,S.tracker+1);render()">+</button></div></div></div>`;
 if(sp=="help")return back("Help & support")+`<div class="card">${[["When do changes lock?","Changes lock 3 days before your ship date."],["How do discounts work?","12 items save 5%, 24 save 8%, 36 save 10%, and 48 save 12%."],["Is shipping free?","Yes, shipping is free for subscribers."],["What’s “just this delivery”?","It changes only your next box. Afterward your saved plan applies again."]].map(f=>`<details><summary>${f[0]}</summary><p class="mu">${f[1]}</p></details>`).join("")}</div><div class="pad"><button class="btn" onclick="S.sheet={t:'prob',s:0};render()">Problem with my delivery</button></div>`;
 return`<div class="hd" style="padding-bottom:20px"><span class="logo">DASANI</span><h1>Profile</h1></div><div class="card"><label class="mu" for="pn">Name</label><input type="text" id="pn" value="${S.user}" onchange="S.user=this.value||S.user;toast('Name updated');render()"></div><div class="card" style="padding:4px 16px">${[["addr","📍","Saved addresses"],["pay","💳","Payment & billing"],["hist","📦","Order history"],["not","🔔","Notifications"],["set","⚙️","App settings"],["help","💬","Help & support"]].map(r=>`<button class="li" onclick="${r[0]=="hist"?"S.tab='delivery';S.seg=3":"S.sub='"+r[0]+"'"};render()"><span>${r[1]}</span><b class="grow">${r[2]}</b>›</button>`).join("")}</div><div class="pad"><button class="btn r" onclick="S={...S,onb:0,user:'',def:{},once:null,status:'active',next:6,tab:'home',sheet:null,sim:false};render()">Sign out</button></div>`}
/* ---------- SHEETS ---------- */
function sheet(){const h=S.sheet;if(!h)return"";let b="";const X='<button class="btn o" style="margin-top:8px" onclick="S.sheet=null;render()">',close=t=>X+(t||"Cancel")+"</button>";
 if(h.t=="up"){const need=sum(h.sc=="every"?S.def:cur())+Object.values(h.m||{}).reduce((a,b)=>a+Math.max(b,0),0),n=h.to||TIERS.find(t=>t>=need&&t>S.size);
  b=n?`<h3>${h.to?"Upgrade your package":"Your package is full"}</h3><p>Upsize to <b>${n} items</b> and save <b>${Math.round(disc(n)*100)}%</b>. Estimated total per box: <b>${fm(price(h.sc=="every"?S.def:cur()).sub*(1-disc(n))*1.07)}</b>.</p><button class="btn g" onclick="${h.to?`snap();S.sheet=null;setSize(${n})`:"upDo()"}">Upsize to ${n} items</button>${close(h.to?"Not now":"Cancel add")}`:`<h3>Your package is full</h3><p class="mu">48 items is the largest preset. Remove something or use a custom size in Delivery › Plan.</p>${close("OK")}`}
 if(h.t=="det"){const p=pd(h.id),q=cur()[p.id]||0;b=`<div style="height:160px;display:flex;justify-content:center;background:var(--tp);border-radius:18px;padding:10px">${art(p)}</div><h3 style="margin-top:12px">${p.n} ${p.nw?'<span class="tag new">New</span>':""}</h3><div class="mu">${lab(p)} · ${fm(p.pr)} each</div><p>${p.d}</p><b>Ingredients</b><p class="mu" style="margin-top:2px">${p.i}</p>${p.id==OOS?'<span class="tag">Out of stock for next delivery</span>':""}<div style="margin:12px 0">${scopeSeg()}</div><div class="row sp"><b>In next box: ${q}</b>${stp(p.id,q)}</div>${close("Done")}`}
 if(h.t=="ask"){const p=pd(h.id);b=`<h3>Add ${p.n} to your box</h3><p class="mu">${p.fl} · ${fm(p.pr)}</p><button class="btn" onclick="S.sheet=null;ap({'${p.id}':1},'once')">Just this delivery</button><button class="btn o" style="margin-top:8px" onclick="S.sheet=null;ap({'${p.id}':1},'every')">Every delivery</button>${close()}`}
 if(h.t=="rev"){const c=cur();b=`<h3>Review package</h3><div style="margin:8px 0">${Object.entries(c).map(([k,v])=>`<div class="pr"><span>${v} × ${pd(k).n}, ${pd(k).fl} ${S.once&&(S.once[k]||0)!=(S.def[k]||0)?'<span class="tag">This delivery only</span>':'<span class="tag ok">Every delivery</span>'}</span><span>${fm(pp(k)*v)}</span></div>`).join("")||'<p class="mu">Empty box.</p>'}</div>${meter(c)}<div style="margin:10px 0">${pricing(c)}</div><button class="btn g" onclick="S.sheet=null;S.last=S.base||S.last;S.base=null;toast('Package saved',!!S.last);render()">Confirm</button><button class="btn o" style="margin-top:8px" onclick="S.sheet=null;if(S.base)rest(S.base);S.base=null;toast('Changes discarded');render()">Discard changes</button>`}
 if(h.t=="skip")b=`<h3>Skip this delivery?</h3><p class="mu">Your next box would arrive ${fd(S.next+S.freq*7)} instead of ${fd(S.next)}.</p><button class="btn" onclick="skip()">Skip delivery</button>${close("Keep delivery")}`;
 if(h.t=="pause")b=`<h3>Pause your subscription?</h3><p class="mu">We’ll hold deliveries until ${fd(34)}. Resume any time.</p><button class="btn" onclick="snap();S.status='paused';S.pauseUntil=34;S.sheet=null;toast('Subscription paused',true);render()">Pause until ${fd(34)}</button>${close()}`;
 if(h.t=="now")b=`<h3>Deliver now?</h3><p class="mu">We’ll rush your current box. It ships today and arrives ${fd(2)}.</p><button class="btn" onclick="snap();S.next=2;S.tracker=1;S.sheet=null;toast('Your box is on its way',true);render()">Confirm delivery</button>${close()}`;
 if(h.t=="cancel")b=h.s==0?`<h3>Before you go</h3><p class="mu">Would one of these work better?</p><button class="opt" onclick="snap();S.status='paused';S.pauseUntil=34;S.sheet=null;toast('Paused until ${fd(34)}',true);render()"><b>Pause for 4 weeks</b></button><button class="opt" onclick="snap();S.freq=4;S.sheet=null;toast('Now every 4 weeks',true);render()"><b>Deliver every 4 weeks</b></button><button class="opt" onclick="snap();setSize(12);S.sheet=null;toast('Size reduced to 12 items',true)"><b>Switch to 12 items</b></button><button class="btn r" onclick="S.sheet={t:'cancel',s:1};render()">Continue to cancel</button>${close("Keep my subscription")}`:`<h3>Cancel subscription?</h3><p class="mu">You’ll stop receiving deliveries. Your saved plan stays for if you come back.</p><button class="btn r" onclick="snap();S.status='canceled';S.sheet=null;toast('Subscription canceled',true);render()">Yes, cancel</button>${close("Keep my subscription")}`;
 if(h.t=="oos"){const alt=P.filter(p=>p.id!=OOS&&(p.cat=="Sparkling"||p.cat=="Flavored"));b=`<h3>${pd(OOS).n} (${pd(OOS).fl}) is out of stock</h3><p class="mu">Applies to your next delivery only. Afterward your original choice returns.</p>${alt.map(p=>`<button class="li" onclick="oos('${p.id}')"><div class="pi">${art(p)}</div><div class="grow"><b>${p.n}</b><div class="mu">${p.fl}</div></div><span class="tag ok">Substitute</span></button>`).join("")}<button class="btn r" style="margin-top:10px" onclick="oos()">Remove from this delivery</button>${close("Decide later")}`}
